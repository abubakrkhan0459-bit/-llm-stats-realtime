<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>404 - Page Not Found | LLM Stats Realtime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The page you are looking for could not be found. Return to LLM Stats Realtime for live LLM rankings and AI model analytics.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://llm-stats-realtime.web.app/404">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #f8fafc;
        }
        
        .error-message {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .suggestions {
            margin-top: 50px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .suggestions h3 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #f8fafc;
        }
        
        .suggestion-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .suggestion-link {
            color: #60a5fa;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            background: rgba(96, 165, 250, 0.1);
            transition: all 0.2s ease;
        }
        
        .suggestion-link:hover {
            background: rgba(96, 165, 250, 0.2);
            color: #93c5fd;
        }
        
        @media (max-width: 600px) {
            .error-code {
                font-size: 80px;
            }
            
            .error-title {
                font-size: 24px;
            }
            
            .error-message {
                font-size: 16px;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you're looking for seems to have wandered off into the digital void. 
            Don't worry, our AI models are trained to help you find what you need!
        </p>
        
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Return Home
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"></path>
                </svg>
                Go Back
            </button>
        </div>
        
        <div class="suggestions">
            <h3>Popular Destinations</h3>
            <div class="suggestion-links">
                <a href="/" class="suggestion-link">Live Rankings</a>
                <a href="/rankings/overall" class="suggestion-link">Overall Rankings</a>
                <a href="/rankings/coding" class="suggestion-link">Coding Models</a>
                <a href="/compare" class="suggestion-link">Compare Models</a>
                <a href="/privacy-policy" class="suggestion-link">Privacy Policy</a>
            </div>
        </div>
    </div>
    
    <script>
        // Store the attempted URL for analytics
        sessionStorage.setItem('404_attempted_url', window.location.href);
        
        // Attempt to redirect to homepage if this is a client-side route
        // This handles Blazor WASM routing
        if (window.location.pathname !== '/404' && window.location.pathname !== '/404.html') {
            // Try to redirect to the SPA's index.html
            // The Blazor router will handle the client-side routing
            sessionStorage.setItem('redirect_after_404', window.location.pathname);
        }
    </script>
</body>
</html>
