<body>
    <div id="app"></div>
    
    <!-- Redirect from firebaseapp.com to web.app domain -->
    <script>
        // Redirect firebaseapp.com to web.app
        if (window.location.hostname === 'llm-stats-realtime.firebaseapp.com') {
            window.location.replace('https://llm-stats-realtime.web.app' + window.location.pathname + window.location.search);
        }
    </script>
    
    <script src="js/site.js"></script>
    <script>
        // Initialize cursor glow and bubble effects when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            if (window.blazorExtensions) {
                window.blazorExtensions.initCursorGlow();
                window.blazorExtensions.initBubbleEffects();
            }
        });
        
        // Re-initialize bubble effects after Blazor renders
        if (window.Blazor) {
            Blazor.addEventListener('afterRender', function() {
                if (window.blazorExtensions) {
                    window.blazorExtensions.initBubbleEffects();
                }
            });
        }
    </script>
    <!-- Blazor WebAssembly - using versioned files for cache-busting and reliability -->
    <script src="_framework/blazor.webassembly.66stpp682q.js"></script>
</body>
