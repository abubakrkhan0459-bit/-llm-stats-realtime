<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Stats Realtime - Live LLM Rankings & Performance Analytics</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/highlights.css" />
    <link rel="stylesheet" href="css/cursor-effects.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LLMStatsBlazor.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app"></div>
    <script src="js/site.js"></script>
    <script>
        // Initialize cursor glow and bubble effects when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            if (window.blazorExtensions) {
                window.blazorExtensions.initCursorGlow();
                window.blazorExtensions.initBubbleEffects();
            }
        });
        
        // Re-initialize bubble effects after Blazor renders
        if (window.Blazor) {
            Blazor.addEventListener('afterRender', function() {
                if (window.blazorExtensions) {
                    window.blazorExtensions.initBubbleEffects();
                }
            });
        }
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
