name: Deploy and Ping Google Search Console

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore LLMStatsBlazor/LLMStatsBlazor.csproj
    
    - name: Build
      run: dotnet build LLMStatsBlazor/LLMStatsBlazor.csproj --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish LLMStatsBlazor/LLMStatsBlazor.csproj --configuration Release --output ./publish --no-build
    
    - name: Verify Framework Files
      run: |
        echo "🔍 Verifying framework files exist..."
        FRAMEWORK_DIR="./publish/wwwroot/_framework"
        
        # Check required versioned files
        if [ ! -f "$FRAMEWORK_DIR/blazor.webassembly.66stpp682q.js" ]; then
          echo "❌ ERROR: blazor.webassembly.66stpp682q.js not found!"
          exit 1
        fi
        echo "✓ blazor.webassembly.66stpp682q.js found"
        
        if [ ! -f "$FRAMEWORK_DIR/dotnet.runtime.2tx45g8lli.js" ]; then
          echo "❌ ERROR: dotnet.runtime.2tx45g8lli.js not found!"
          exit 1
        fi
        echo "✓ dotnet.runtime.2tx45g8lli.js found"
        
        # Create non-versioned copies as backup for legacy support
        cd "$FRAMEWORK_DIR"
        
        # Create blazor.webassembly.js backup
        if [ ! -f "blazor.webassembly.js" ] && [ -f "blazor.webassembly.66stpp682q.js" ]; then
          cp blazor.webassembly.66stpp682q.js blazor.webassembly.js
          echo "✓ Created blazor.webassembly.js backup"
        fi
        
        # Create dotnet.runtime.js backup
        if [ ! -f "dotnet.runtime.js" ] && [ -f "dotnet.runtime.2tx45g8lli.js" ]; then
          cp dotnet.runtime.2tx45g8lli.js dotnet.runtime.js
          echo "✓ Created dotnet.runtime.js backup"
        fi
        
        # Create dotnet.js from latest version
        if [ ! -f "dotnet.js" ]; then
          latest_dotnet=$(ls -t dotnet.*.js 2>/dev/null | grep -v runtime | grep -v native | head -1)
          if [ -n "$latest_dotnet" ]; then
            cp "$latest_dotnet" dotnet.js
            echo "✓ Created dotnet.js from $latest_dotnet"
          fi
        fi
        
        echo "✅ Framework files verified and backed up!"
      shell: bash
    
    - name: Deploy to Firebase
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        channelId: live
        projectId: llm-stats-realtime
    
    - name: Wait for deployment
      run: sleep 30
    
    - name: Test Live URL
      run: |
        echo "🧪 Testing framework file accessibility..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://llm-stats-realtime.web.app/_framework/blazor.webassembly.66stpp682q.js")
        if [ "$STATUS" = "200" ]; then
          echo "✅ Framework files accessible (HTTP 200)"
        else
          echo "⚠️ Framework file returned HTTP $STATUS - may need cache refresh"
        fi
    
    - name: Ping Google Search Console
      run: |
        curl -X GET "https://www.google.com/ping?sitemap=https://llm-stats-realtime.web.app/sitemap.xml" || true
    
    - name: Notify deployment complete
      run: |
        echo "✅ Deployment to https://llm-stats-realtime.web.app completed"
        echo "📊 Sitemap URL: https://llm-stats-realtime.web.app/sitemap.xml"
        echo "🤖 robots.txt: https://llm-stats-realtime.web.app/robots.txt"
        echo "📢 ads.txt: https://llm-stats-realtime.web.app/ads.txt"
